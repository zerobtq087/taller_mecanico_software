server:
  port: 8080

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: taller-security
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taller_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:taller_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 240
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap:
    admin:
      enabled: ${ADMIN_INITIAL_ENABLED:true}
      name: ${ADMIN_INITIAL_NAME:Administrador del Sistema}
      email: ${ADMIN_INITIAL_EMAIL:admin@taller.local}
      password: ${ADMIN_INITIAL_PASSWORD:Admin12345!}
